[project]
name = "mini-muse"
version = "0.1.0"
description = "A small comic-strip agent: one idea -> storyboard -> panels -> composed strip."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pillow>=10.4",
    "uvicorn>=0.29",
    "openai>=1.40",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
